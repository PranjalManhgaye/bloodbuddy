name: Verify Render API

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render backend health
        run: |
          response=$(curl -sf https://bloodbuddy-api.onrender.com/health || echo "failed")
          echo "$response"
          echo "$response" | grep -q healthy
